# maravilla.bernardocastro.dev — the server block of the `bernardocastro`
# CONTAINER. Lives on the box as /etc/nginx/sites-available/maravilla, with a
# symlink in sites-enabled/. This file is the source: edit here, upload,
# `nginx -t`, then reload.
#
# TLS terminates on the relay (34.71.115.185); only plain HTTP arrives here
# over WireGuard. No certbot and no `listen 443` in this file.

# The relay already told us the client's real scheme. This hop is plain HTTP,
# so `$scheme` here is "http": passing it through would OVERWRITE the relay's
# `X-Forwarded-Proto: https`. With two layers of nginx any forwarded header is
# overwritten by the second one — it already bit gist. Respect the incoming
# value and fall back to $scheme only when none came.
map $http_x_forwarded_proto $maravilla_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $maravilla_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name maravilla.bernardocastro.dev;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:2141;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $maravilla_forwarded_proto;

        # /api/events is Server-Sent Events: a buffering proxy holds the whole
        # stream and the Watch panel never moves.
        proxy_buffering off;
        proxy_read_timeout 3600s;

        # WebSocket upgrade — only when the client actually asked for one, so a
        # plain request (and the SSE stream) keeps a normal keep-alive connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $maravilla_upgrade;
    }
}
