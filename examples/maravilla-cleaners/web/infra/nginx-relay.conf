# maravilla.bernardocastro.dev — the server block of the RELAY
# (gpu-relay, 34.71.115.185). TLS terminates HERE; the request then travels
# over WireGuard to the container's nginx on 10.8.0.2:8082.
#
# Lives on the relay as /etc/nginx/sites-available/maravilla (+ symlink).
# The certificate is the one shared SANs cert — it is EXPANDED, never replaced:
#   sudo certbot certonly --nginx --expand --cert-name bernardocastro.dev \
#        -d <every existing SAN> -d maravilla.bernardocastro.dev

map $http_upgrade $maravilla_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name maravilla.bernardocastro.dev;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name maravilla.bernardocastro.dev;
    ssl_certificate /etc/letsencrypt/live/bernardocastro.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bernardocastro.dev/privkey.pem;
    client_max_body_size 50m;

    location / {
        proxy_pass http://10.8.0.2:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;

        # SSE: no buffering, and a timeout long enough for a call to happen.
        proxy_buffering off;
        proxy_read_timeout 3600s;

        # WebSocket upgrade — only when the client actually asked for one, so a
        # plain request (and the SSE stream) keeps a normal keep-alive connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $maravilla_upgrade;
    }
}
